name: Verify kit and docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:audit
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=dist/verification-tests.json
      - run: npm run test:mcp
      - run: npm run check:bundles
      - run: npm run docs:verify
      - run: npm run docs:verify -- --reuse-build --innovation-only
      - run: npm run smoke:package
      - name: Record verification results
        shell: pwsh
        run: |
          node scripts/check-bundles.mjs --json | Set-Content -Encoding utf8 dist/verification-bundles.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/benchmark.mjs | Set-Content -Encoding utf8 dist/verification-benchmark.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/write-verification.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-verification-${{ matrix.os }}
          path: docs/dist/verification.json
